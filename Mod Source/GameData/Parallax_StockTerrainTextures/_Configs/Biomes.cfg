@ParallaxTerrain:HAS[@Body[Kerbin]]:FINAL
{
    @Body[Kerbin]
    {
        BiomeLayer
        {
            name = Deserts
            channel   = 0

            _BiomeTex       = Parallax_StockTerrainTextures/Kerbin/PluginData/low00.dds
            _BiomeBumpMap       = Parallax_StockTerrainTextures/Kerbin/PluginData/low01.dds
            _BiomeDisplacementMap = Parallax_StockTerrainTextures/Kerbin/PluginData/displacement.dds
            _BiomeInfluenceMap    = Parallax_StockTerrainTextures/Kerbin/PluginData/influence.dds
            _BiomeOcclusionMap    = Parallax_StockTerrainTextures/Kerbin/PluginData/occlusion.dds

            _BiomeTiling            = 0.03
            _BiomeDisplacementScale = 0.5
            _BiomeInfluenceStrength = 0.5
            _BiomeBumpScale         = 1
            _BiomeOcclusionStrength = 0.5

            _BiomeEdgeNoise = 0.5
            _Feather   = 15
            _Tolerance = 0.03
        }
    }
}